# Metadatos de la plantilla para el catálogo de NoExpertise.
id: clinica-estetica
nombre: Clínica estética
descripcion: "Web lujosa en blanco, oro y perla para clínicas estéticas, láser y dermatología, con tratamientos y cita."
sectores:
  - { id: clinica-estetica, nombre: Clínica estética }
  - { id: medicina-estetica, nombre: Medicina estética }
  - { id: laser, nombre: Láser y depilación }
  - { id: dermatologia, nombre: Dermatología }
  - { id: dental-estetica, nombre: Estética dental }
secciones:
  - { id: hero, nombre: Portada }
  - { id: tratamientos, nombre: Tratamientos }
  - { id: sobre, nombre: La clínica }
  - { id: tecnologia, nombre: Tecnología }
  - { id: equipo, nombre: Equipo médico }
  - { id: ofertas, nombre: Promociones }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: cita, nombre: Pedir cita }
  - { id: contacto, nombre: Contacto }
estilo: lujoso
plan_minimo: presencia
version: 1.0.0
base: astrowind
demo_url: https://demo-plantilla-clinica-estetica.noexpertise.com
activa: true
orden: 280

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu clínica"
    pregunta: "¿Cómo se llama tu clínica y qué tratamientos hacéis?"
    ayuda: "Medicina estética, láser, dermatología, estética dental… y qué os diferencia."
    tipo: texto
    campos: [nombre, eslogan, seo.titulo, seo.descripcion, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden pedir cita?"
    ayuda: "Solo lo que quieras que vean tus pacientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, secciones.cita.enlace_reservas, redes.instagram, redes.facebook]
  - id: tratamientos
    titulo: "Tus tratamientos"
    pregunta: "Cuéntame los tratamientos que hacéis, con su categoría, duración y precio si quieres. Uno por línea."
    ayuda: "Por ejemplo: higiene facial médica, facial, 60 minutos. Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.tratamientos.tratamientos]
  - id: sobre
    titulo: "La clínica"
    pregunta: "¿Cómo es tu clínica y cómo trabajáis con cada paciente?"
    ayuda: "Desde cuándo estáis, cómo es el espacio, qué cuidáis especialmente."
    tipo: texto
    campos: [secciones.sobre.titulo, secciones.sobre.declaracion, secciones.sobre.texto, secciones.sobre.items]
  - id: tecnologia
    titulo: "Tecnología"
    pregunta: "¿Con qué equipos o técnicas trabajáis?"
    ayuda: "Láser, radiofrecuencia, diagnóstico de la piel… Sin marcas si no quieres."
    tipo: texto
    campos: [secciones.tecnologia.titulo, secciones.tecnologia.texto, secciones.tecnologia.items]
  - id: equipo
    titulo: "Tu equipo"
    pregunta: "¿Quién forma el equipo? Nombre y especialidad de cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.equipo.personas]
  - id: ofertas
    titulo: "Promociones"
    pregunta: "¿Tenéis bonos, promociones o una primera valoración gratuita? Una por línea."
    ayuda: "Si ahora no tenéis, salta este paso."
    tipo: lista
    campos: [secciones.ofertas.ofertas]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo vuestros pacientes? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon fotos de tu clínica, de las cabinas y de tus equipos."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.sobre.imagen, secciones.tecnologia.imagen, secciones.cita.imagen, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
